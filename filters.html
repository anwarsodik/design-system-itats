<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Filter Bar - ITATS Design System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=4"></head>
<body><div class="app-container"><aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo">ITATS Design</div></div><nav class="sidebar-nav" id="sidebarNavAccordion"><a href="data-table.html" class="nav-sub-item">Data Table</a><a href="filters.html" class="nav-sub-item active">Filters</a><a href="empty-states.html" class="nav-sub-item">Empty States</a></nav></aside><main class="main-content">
<h1>Filter Bar</h1><p class="text-lead">Pola filter dashboard untuk tabel dan laporan: search, select, tanggal, active chips, reset, dan apply.</p>
<section class="showcase-section"><h2>Advanced Filters</h2><div class="component-demo bg-light"><div class="filter-bar"><div class="row g-3 align-items-end"><div class="col-lg-4"><label class="form-label">Search</label><input class="form-control" placeholder="Nama, NPM, kode mata kuliah"></div><div class="col-6 col-lg-2"><label class="form-label">Status</label><select class="form-select"><option>Semua</option><option>Aktif</option><option>Pending</option></select></div><div class="col-6 col-lg-2"><label class="form-label">Periode</label><input type="month" class="form-control"></div><div class="col-lg-4 d-flex gap-2 justify-content-lg-end"><button class="btn btn-light border">Reset</button><button class="btn btn-primary">Terapkan</button></div></div><div class="d-flex flex-wrap gap-2 mt-3"><span class="active-filter-chip">Status: Aktif <span aria-hidden="true">x</span></span><span class="active-filter-chip">Periode: 2026-07 <span aria-hidden="true">x</span></span></div></div></div></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
