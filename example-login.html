<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - ITATS Design System</title>
    <link rel="icon" type="image/x-icon" href="https://portal.itats.ac.id/wp-content/uploads/2023/07/cropped-Logo-Lengkap-150x150.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        body {
            background-color: var(--bs-body-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bs-surface);
            border-radius: var(--bs-border-radius-lg);
            box-shadow: var(--bs-box-shadow-lg);
            border: 1px solid var(--bs-border-color);
            padding: 2.5rem;
        }

        .login-logo {
            width: 72px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--bs-text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--bs-primary);
        }
    </style>
</head>

<body>

    <a href="examples.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Examples
    </a>

    <div class="login-card">
        <div class="text-center">
            <img src="img/logo-itats.png" alt="ITATS Logo" class="login-logo">
            <h1 class="h4 fw-bold mb-1">Welcome Back</h1>
            <p class="text-muted mb-4" style="font-size: 0.875rem;">Please sign in to your account</p>
        </div>

        <form>
            <div class="mb-3">
                <label for="npmEmail" class="form-label">NPM / Email Address</label>
                <input type="text" class="form-control" id="npmEmail" placeholder="e.g. 06.2020.1.00000" required autofocus>
            </div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label for="password" class="form-label mb-0">Password</label>
                    <a href="#" class="text-decoration-none" style="font-size: 0.8125rem;">Forgot password?</a>
                </div>
                <input type="password" class="form-control" id="password" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                <label class="form-check-label text-secondary" for="rememberMe" style="font-size: 0.875rem;">
                    Remember me for 30 days
                </label>
            </div>

            <button class="btn btn-primary w-100 py-2 mb-3" type="submit">Sign in</button>
            
            <div class="text-center mt-4">
                <p class="text-muted mb-0" style="font-size: 0.8125rem;">
                    Need help? <a href="#" class="text-decoration-none">Contact IT Support</a>
                </p>
            </div>
        </form>
    </div>

</body>
</html>
