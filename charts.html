<h1>Charts</h1><p class="text-lead">Pola visualisasi dashboard. Gunakan Chart.js/ApexCharts di aplikasi produksi, dan pertahankan token warna ITATS.</p>
<section class="showcase-section"><h2>Chart Cards</h2><div class="component-demo bg-light"><div class="row g-3">
<div class="col-lg-8"><div class="chart-card"><div class="d-flex justify-content-between align-items-start mb-3"><div><h3 class="h6 mb-1">Tren Presensi</h3><p class="text-muted mb-0">Rata-rata 6 bulan terakhir</p></div><span class="badge bg-primary">91%</span></div><div class="chart-placeholder"><div class="chart-bar" style="height:50%"></div><div class="chart-bar" style="height:64%"></div><div class="chart-bar" style="height:58%"></div><div class="chart-bar" style="height:72%"></div><div class="chart-bar" style="height:86%"></div><div class="chart-bar" style="height:78%"></div></div></div></div>
